<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>SUDARSHAN CHAKRA 3D WEAPON SHOWCASE</title>
  <style>
    body { margin: 0; background: #05060f; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
    #canvas { width: 100vw; height: 100vh; display: block; }
    .badge {
      position: absolute;
      top: 25px;
      left: 25px;
      background: rgba(10, 12, 25, 0.85);
      border: 2px solid #ffd700;
      padding: 12px 24px;
      border-radius: 10px;
      color: #ffd700;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.3);
    }
    .badge h1 { margin: 0; font-size: 20px; letter-spacing: 2px; }
    .badge p { margin: 4px 0 0; font-size: 12px; color: #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
  <div class="badge">
    <h1>SUDARSHAN CHAKRA 3D</h1>
    <p>Phase 02: 24 Katili Blades | PBR Vedic Gold | 108 Blades Storm</p>
  </div>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(1280, 720);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060714);

    const camera = new THREE.PerspectiveCamera(45, 1280 / 720, 0.1, 100);
    camera.position.set(0, 8, 14);
    camera.lookAt(0, 0, 0);

    // Lights
    const amb = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(amb);

    const sun = new THREE.DirectionalLight(0xffea88, 2.0);
    sun.position.set(10, 20, 15);
    scene.add(sun);

    const rimLight = new THREE.DirectionalLight(0x00e5ff, 1.2);
    rimLight.position.set(-10, -5, -10);
    scene.add(rimLight);

    const chakraLight = new THREE.PointLight(0xff9900, 3.0, 20);
    scene.add(chakraLight);

    // Build Chakra
    const chakra = new THREE.Group();
    scene.add(chakra);

    const goldMat = new THREE.MeshStandardMaterial({
      color: 0xffd700,
      metalness: 0.95,
      roughness: 0.15
    });

    const bladeMat = new THREE.MeshStandardMaterial({
      color: 0xf5f5f5,
      metalness: 0.98,
      roughness: 0.08
    });

    const coreMat = new THREE.MeshStandardMaterial({
      color: 0xff8800,
      metalness: 0.85,
      roughness: 0.25,
      emissive: 0x442200
    });

    // Central Multi-tier Dome
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2.0, 0.6, 32), goldMat);
    chakra.add(hub);

    const dome = new THREE.Mesh(new THREE.SphereGeometry(1.2, 32, 16), coreMat);
    dome.position.y = 0.3;
    chakra.add(dome);

    // Concentric Ring
    const ring = new THREE.Mesh(new THREE.TorusGeometry(3.8, 0.25, 16, 48), goldMat);
    ring.rotation.x = Math.PI / 2;
    chakra.add(ring);

    // 8 Radial Spoke Ribs
    for (let i = 0; i < 8; i++) {
      const ang = (i / 8) * Math.PI * 2;
      const spoke = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 2.0), goldMat);
      spoke.position.set(Math.cos(ang) * 2.8, 0, Math.sin(ang) * 2.8);
      spoke.rotation.y = -ang + Math.PI / 2;
      chakra.add(spoke);
    }

    // 24 Curved Razor Katili Blades
    for (let i = 0; i < 24; i++) {
      const ang = (i / 24) * Math.PI * 2;
      const blade = new THREE.Mesh(new THREE.ConeGeometry(0.35, 1.6, 4), bladeMat);
      blade.position.set(Math.cos(ang) * 4.4, 0, Math.sin(ang) * 4.4);
      blade.rotation.y = -ang + 0.45;
      blade.rotation.z = Math.PI / 2;
      chakra.add(blade);
    }

    // Glowing Halo
    const halo = new THREE.Mesh(
      new THREE.RingGeometry(4.8, 5.2, 48),
      new THREE.MeshBasicMaterial({ color: 0xffaa00, side: THREE.DoubleSide, transparent: true, opacity: 0.85 })
    );
    halo.rotation.x = Math.PI / 2;
    chakra.add(halo);

    chakra.rotation.x = 0.5;
    chakra.rotation.y = 0.3;

    renderer.render(scene, camera);
  </script>
</body>
</html>
